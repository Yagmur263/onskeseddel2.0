<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ønskelisten</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header class="topbar"><a th:href="@{/}">Ønskelisten</a></header>
<main>
    <p class="fejl" th:if="${fejl}" th:text="${fejl}"></p>

    <section class="rude" th:if="${navn == null}">
        <h1>Velkommen</h1>
        <form th:action="@{/profil}" method="post">
            <label for="navn">Hvad hedder du?</label>
            <input type="text" id="navn" name="navn" maxlength="100" required
                   placeholder="Fornavn og efternavn">
            <button type="submit">Gem navn</button>
        </form>
    </section>

    <th:block th:if="${navn != null}">
        <section class="profil">
            <div class="avatar" aria-hidden="true" th:text="${initialer}">DK</div>
            <div>
                <h1 th:text="${navn}">Navn</h1>
                <div class="tal">
                    <div>
                        <strong th:text="${antalOnsker}">3</strong>
                        <span th:text="${antalOnsker == 1 ? 'ønske' : 'ønsker'}">ønsker</span>
                    </div>
                    <div>
                        <strong th:text="${antalLister}">1</strong>
                        <span th:text="${antalLister == 1 ? 'ønskeliste' : 'ønskelister'}">ønskeliste</span>
                    </div>
                </div><a class="venner-knap" href="#venner">
    <span class="ikon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="6.5"/>
            <path d="M16 16l4.5 4.5"/>
        </svg>
    </span>
                <span>venner</span>
            </a>
            </div>
        </section>

        <h2>Dine ønskelister</h2>
        <section id="venner" class="rude venner-boks">
            <h2>Find en vens ønskeliste</h2>
            <p>Indsæt det link, din ven har sendt dig.</p>
            <form th:action="@{/venner/find}" method="post">
                <label for="link">Delingslink</label>
                <input type="text" id="link" name="link" maxlength="300" required
                       placeholder="http://.../del/...">
                <button type="submit">Åbn listen</button>
                <a href="#">Luk</a>
            </form>
        </section>
        <ul class="lister">
            <li th:each="liste : ${lister}">
                <a th:href="@{/lister/{id}(id=${liste.id})}" th:text="${liste.titel}">Titel</a>
            </li>
            <li class="ny">
                <form th:action="@{/lister}" th:object="${nyListe}" method="post">
                    <label for="titel">Ny ønskeliste</label>
                    <input type="text" id="titel" th:field="*{titel}" maxlength="100" required
                           placeholder="fx Fødselsdag:)">
                    <button type="submit">Opret</button>
                </form>
            </li>
        </ul>
    </th:block>
</main>
</body>
</html>
